<circle cx="0" cy="39" r="2" fill="#c9bbff"/></g>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="26" y="50" fill="#fbf7f5" font-size="35" font-weight="700" letter-spacing="-1.4">Resolution Fast</text>
