<svg xmlns="http://www.w3.org/2000/svg" width="740" height="178" viewBox="0 0 740 178" role="img" aria-labelledby="title desc">
<title id="title">Buscante</title><desc id="desc">Pesquise livros por título e descubra capas, sinopses e datas de publicação. Angular · TypeScript · Google Books API.</desc>
<defs>
<clipPath id="bounds"><rect x=".75" y=".75" width="738.5" height="176.5" rx="18"/></clipPath>
<linearGradient id="surface" x2="1" y2=".15" gradientUnits="objectBoundingBox"><stop stop-color="#11131b"/><stop offset=".53" stop-color="#191923"/><stop offset="1" stop-color="#5a353b"/></linearGradient>
<radialGradient id="light"><stop stop-color="#ffc1a9" stop-opacity=".17"/><stop offset="1" stop-color="#ffc1a9" stop-opacity="0"/></radialGradient>
<linearGradient id="beam"><stop stop-color="#87ffbb" stop-opacity=".01"/><stop offset="1" stop-color="#87ffbb" stop-opacity=".44"/></linearGradient>
<linearGradient id="glass" x2="0" y2="1"><stop stop-color="#443658"/><stop offset="1" stop-color="#25223a"/></linearGradient>
<linearGradient id="cover" x2="1" y2="1"><stop stop-color="#a36a65"/><stop offset="1" stop-color="#624148"/></linearGradient>
<pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#ffc1a9" opacity=".23"/></pattern>
<style>
.sweep{animation:scan 6s linear infinite}.ping{animation:signal 3s ease-out infinite;transform-origin:23px -35px}.resize{animation:fit 4.5s ease-in-out infinite}.lens{animation:search 5s ease-in-out infinite}
@keyframes scan{to{transform:rotate(360deg)}}@keyframes signal{0%{opacity:.95;transform:scale(.5)}85%,100%{opacity:0;transform:scale(1.5)}}@keyframes fit{0%,20%,100%{transform:scale(.72)}48%,72%{transform:scale(1.27)}}@keyframes search{0%,100%{transform:translate(-7px,5px)}40%{transform:translate(5px,-9px)}70%{transform:translate(9px,4px)}}
@media(prefers-reduced-motion:reduce){.sweep,.ping,.resize,.lens{animation:none}}
</style></defs>
<g clip-path="url(#bounds)"><rect width="740" height="178" fill="url(#surface)"/><ellipse cx="606" cy="108" rx="155" ry="122" fill="url(#light)"/>
<path d="M504 0h236v178H461Z" fill="url(#dots)"/>
<g transform="translate(594 90)" stroke-linejoin="round">
<g transform="rotate(-12 -18 10)"><rect x="-52" y="-40" width="66" height="90" rx="5" fill="#5c4754" stroke="#c3959b"/><path d="M-44 -39v88" stroke="#dda5a5"/></g>
<g transform="rotate(7 8 8)"><rect x="-29" y="-52" width="73" height="101" rx="5" fill="url(#cover)" stroke="#ffc7ac" stroke-width="2"/><path d="M-20 -51v98" stroke="#f3bdab" opacity=".5"/><path d="M17 -51h12v24l-6-4-6 4Z" fill="#ffe1b2"/><g stroke="#f1bea9" stroke-width="2"><path d="M-9 -9h37M-9 0h27M-9 9h31"/></g><path d="M-23 41h66" stroke="#fbd0bc" opacity=".5"/></g>
<g class="lens"><path d="m41 20 22 24" fill="none" stroke="#231a20" stroke-width="10" stroke-linecap="round"/><path d="m41 20 22 24" fill="none" stroke="#f9bc96" stroke-width="6" stroke-linecap="round"/><circle cx="27" cy="5" r="22" fill="#553e41" fill-opacity=".75" stroke="#ffdbbd" stroke-width="3.5"/><path d="M15 2a12 12 0 0 1 10-10" fill="none" stroke="#fff1da" stroke-width="2.5" stroke-linecap="round"/></g></g>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="26" y="50" fill="#fbf7f5" font-size="35" font-weight="700" letter-spacing="-1.4">Buscante</text>
<text x="28" y="84" fill="#e5e1e7" font-size="17"><tspan>Pesquise livros por título e descubra capas,</tspan><tspan x="28" dy="23">sinopses e datas de publicação.</tspan></text>
<path d="M28 140h20" stroke="#ffc1a9" stroke-width="3" stroke-linecap="round"/><text x="60" y="146" fill="#ffc1a9" font-size="15" font-weight="600">Angular · TypeScript · Google Books API</text></g>
<g transform="translate(703 22)" stroke="#ffc1a9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0 9l9-9M1 0h8v8"/></g></g>
<rect x=".75" y=".75" width="738.5" height="176.5" rx="18" stroke="#ffc1a9" stroke-opacity=".3" fill="none"/></svg>
